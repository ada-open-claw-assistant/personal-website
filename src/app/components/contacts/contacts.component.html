<section class="contacts section" id="contact" aria-labelledby="contact-title">
  <h2 id="contact-title">Contact</h2>
  <div class="cards">
    <a class="card" [href]="'mailto:'+email" aria-label="Email Andrea"> 
      <strong>Email</strong>
      <span>{{email}}</span>
    </a>

    <div class="socials">
      <a *ngFor="let s of socials" class="card" [href]="s.url" target="_blank" rel="noopener" [attr.aria-label]="'Open '+s.name">
        <strong>{{s.name}}</strong>
        <span>Visit profile</span>
      </a>
    </div>
  </div>
</section>
