<section class="skills section" role="region" aria-label="Skills">
  <h2>Skills</h2>
  <div class="tags">
    <button *ngFor="let s of skills" class="chip" type="button" aria-pressed="false">{{s.name}}</button>
  </div>
  <div class="list">
    <div *ngFor="let s of skills; let i = index" class="skill reveal" tabindex="0" role="group" [attr.aria-label]="s.name + ' skill'">
      <div class="meta"><strong>{{s.name}}</strong><span class="percent">{{s.pct}}%</span></div>
      <div class="bar" aria-hidden="true"><div class="fill" [style.width.%]="s.pct" [attr.data-value]="s.pct"></div></div>
    </div>
  </div>
</section>
