<section class="skills section" role="region" aria-label="Skills">
  <h2>Skills</h2>
  <div class="tags">
    <span *ngFor="let s of skills" class="tag">{{s.name}}</span>
  </div>
  <div class="list">
    <div *ngFor="let s of skills" class="skill">
      <div class="meta"><strong>{{s.name}}</strong><span>{{s.pct}}%</span></div>
      <div class="bar"><i [attr.data-value]="s.pct"></i></div>
    </div>
  </div>
</section>
