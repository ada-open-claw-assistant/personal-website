<section class="skills section" id="skills" aria-labelledby="skills-title">
  <h2 id="skills-title">Skills</h2>
  <div class="chips panel">
    <button *ngFor="let s of skills" class="chip" aria-pressed="false">{{s.name}}</button>
  </div>
  <div class="bars">
    <div *ngFor="let s of skills" class="bar-row">
      <div class="label">{{s.name}}</div>
      <div class="bar" aria-hidden="true"><div class="fill" [attr.data-level]="s.level" style="width:0"></div></div>
      <div class="percent">{{s.level}}%</div>
    </div>
  </div>
</section>
